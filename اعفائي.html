<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعفائي | نظام الطالب الذكي وتوقع الأسئلة</title>
<script src="https://apis.google.com/js/api.js"></script>

<style>
:root{
 --bg:#0a0e27;--panel:#111832;--panel2:#0b1128;
 --green:#1a5f4a;--green2:#0f3d2f;--gold:#d4af37;
 --text:#f5f1df;--muted:#aab1c2;--red:#b8444f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.sidebar{
 position:fixed;right:0;top:0;bottom:0;width:240px;padding:20px 14px;
 background:linear-gradient(180deg,#0b102b,#071b20);
 border-left:1px solid #5a4920;z-index:5;overflow-y:auto
}
.logo{text-align:center;color:var(--gold);font-size:25px;font-weight:bold;padding:12px;border-bottom:1px solid #594a25}
.logo small{display:block;color:var(--muted);font-size:11px;margin-top:7px}
.nav{margin-top:20px}
.nav button{
 display:block;width:100%;background:none;border:0;color:var(--muted);
 padding:13px 12px;margin:4px 0;text-align:right;border-radius:8px
}
.nav button:hover,.nav button.active{background:var(--green2);color:var(--gold);border-right:3px solid var(--gold)}
.main{margin-right:240px;padding:28px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #594a25;padding-bottom:18px;margin-bottom:24px}
h1{font-size:25px;color:var(--gold);margin:0 0 7px}
h2{font-size:21px;margin-top:0}
h3{color:var(--gold)}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}
.card{
 background:linear-gradient(145deg,var(--panel),#0d1430);
 border:1px solid #5a4925;border-radius:13px;padding:19px;
 box-shadow:0 12px 35px #0005
}
.stat{font-size:30px;color:var(--gold);font-weight:bold;margin:10px 0}
.btn{background:var(--green2);border:1px solid var(--gold);color:var(--text);border-radius:8px;padding:9px 14px}
.btn:hover{background:var(--green)}
.btn.gold{background:var(--gold);color:#151306}
.btn.red{background:#54212b;border-color:var(--red)}
.btn.gray{background:#252d43;border-color:#697086}
.actions{display:flex;gap:8px;flex-wrap:wrap}
input,textarea,select{
 width:100%;background:#080d22;color:var(--text);border:1px solid #3e4966;
 padding:10px;border-radius:8px;outline:none
}
textarea{min-height:100px;resize:vertical}
label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}
.progress{height:9px;background:#252b45;border-radius:20px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
table{width:100%;border-collapse:collapse}
th,td{padding:11px;border-bottom:1px solid #4c4024;text-align:right}
th{color:var(--gold)}
.badge{background:var(--green2);padding:5px 9px;border-radius:20px;font-size:12px}
.badge.alert{background:#54212b;color:#ffb4b4;border:1px solid var(--red)}
.storage{display:grid;grid-template-columns:190px 1fr;gap:20px}
.subjects{border-left:1px solid #594a25;padding-left:15px}
.subjects button{
 width:100%;display:block;text-align:right;padding:10px;margin:5px 0;
 background:none;color:var(--muted);border:1px solid transparent;border-radius:7px
}
.subjects button.active,.subjects button:hover{background:var(--green2);color:var(--gold);border-color:#594a25}
.summary{background:var(--panel2);border:1px solid #34405d;border-radius:10px;padding:15px;margin-top:12px}
.summary p{white-space:pre-wrap;line-height:1.8}
.empty{text-align:center;color:var(--muted);padding:40px}
.timer{text-align:center;color:var(--gold);font-size:72px;margin:25px 0}
.chat{
 height:410px;overflow:auto;background:var(--panel2);
 border:1px solid #39445f;border-radius:10px;padding:15px;margin:15px 0
}
.msg{max-width:82%;padding:11px 14px;margin:9px 0;white-space:pre-wrap;line-height:1.8;border-radius:10px}
.msg.user{background:var(--green);margin-right:auto}
.msg.ai{background:#252d43;margin-left:auto;border-left:3px solid var(--gold)}
.chatrow{display:flex;gap:9px;align-items:end}
.chatrow textarea{min-height:62px}
.task{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #4c4024}
.task.done span{text-decoration:line-through;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:20}
.modal.show{display:flex}
.modalbox{background:#111832;border:1px solid var(--gold);border-radius:13px;padding:22px;width:min(600px,92%)}
.toast{display:none;position:fixed;left:20px;bottom:20px;background:var(--green);padding:12px 18px;border-radius:8px;z-index:30}
.question-card{
 background:var(--panel2);border-radius:8px;padding:12px;
 border-right:4px solid var(--gold);font-size:13px;display:flex;flex-direction:column;gap:6px;border:1px solid #4c4024
}
.question-header{display:flex;justify-content:space-between;color:var(--gold);font-weight:bold;font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){
 .sidebar{position:static;width:100%}.main{margin:0;padding:17px}
 .nav{display:grid;grid-template-columns:repeat(2,1fr)}
 .grid,.grid2,.storage{grid-template-columns:1fr}
 .subjects{border:0;padding:0}.top{display:block}
 .chatrow{display:block}.chatrow button{width:100%;margin-top:8px}
}
</style>
</head>

<body>
<div class="app">
<aside class="sidebar">
 <div class="logo">إعفائي<small>نظام الطالب الذكي</small></div>
 <nav class="nav">
  <button data-page="home">الرئيسية</button>
  <button data-page="storage">المخزن المحلي</button>
  <button data-page="scratchpad">دفتر الأفكار السريعة</button>
  <button data-page="schedule">جدول الحصص</button>
  <button data-page="calculator">حاسبة الإعفاء العام</button>
  <button data-page="radar">رادار المواد الراكدة</button>
  <button data-page="prediction">نظام التنبؤ الذكي</button>
  <button data-page="pomodoro">مؤقت بومودورو</button>
  <button data-page="tasks">قائمة المهام</button>
  <button data-page="gemini">محادثة جيميناي</button>
  <button data-page="settings">الإعدادات</button>
 </nav>
</aside>

<main class="main">
 <div class="top">
  <div><h1 id="title">لوحة التحكم</h1><span class="muted" id="date"></span></div>
  <button class="btn gold" onclick="archiveYear()">أرشفة السنة الحالية</button>
 </div>
 <section id="content"></section>
</main>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <h2 id="modalTitle">إضافة ملخص</h2>
  <input type="hidden" id="editId">
  <label>العنوان</label><input id="sumTitle">
  <label>المحتوى</label><textarea id="sumBody"></textarea>
  <label>ملاحظة / مرجع</label><input id="sumNote" placeholder="رقم الصفحة أو مصدر الملخص">
  <br><br>
  <div class="actions">
   <button class="btn gold" onclick="saveSummary()">حفظ في المخزن</button>
   <button class="btn gray" onclick="closeModal()">إلغاء</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const subjects=[
 "الرياضيات","الفيزياء","الكيمياء","الأحياء","اللغة العربية",
 "اللغة الإنجليزية","التاريخ","الجغرافيا","الحاسوب"
];

let GEMINI_API_KEY = sessionStorage.getItem("geminiKey") || "";

let state = JSON.parse(localStorage.getItem("studentApp")) || {
 page:"home", subject:subjects[0], summaries:[], tasks:[],
 grades:{}, schedule:[], studySeconds:0, archives:[], radarRecords:{}, scratchpadText:"", predictionTab:"workspace"
};

state.studySeconds = Number(state.studySeconds || 0);
if (!state.radarRecords) state.radarRecords = {};
if (state.scratchpadText === undefined) state.scratchpadText = "";
if (!state.predictionTab) state.predictionTab = "workspace";

function save() { localStorage.setItem("studentApp", JSON.stringify(state)); }
function esc(x="") { return String(x).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
function toast(x) { let t = document.getElementById("toast"); t.textContent = x; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500); }
function go(p) { state.page = p; save(); render(); }
function average() { let a = Object.values(state.grades).filter(x => x !== ""); return a.length ? Math.round(a.reduce((x, y) => x + Number(y), 0) / a.length) : 0; }
function hours() { return (state.studySeconds / 3600).toFixed(2); }
function studyTime() { let h = Math.floor(state.studySeconds / 3600), m = Math.floor(state.studySeconds % 3600 / 60); return `${h} ساعة و ${m} دقيقة`; }
function fmtTime(s) { return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.page));

function exportLocalBackup() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "student_app_local_backup.json");
    dlAnchorElem.click();
    toast("تم تصدير نسخة احتياطية محلية بنجاح");
}

function importLocalBackup(event) {
    const fileReader = new FileReader();
    if (event.target.files[0]) {
        fileReader.readAsText(event.target.files[0], "UTF-8");
        fileReader.onload = (e) => {
            try {
                state = JSON.parse(e.target.result);
                if (!state.radarRecords) state.radarRecords = {};
                if (state.scratchpadText === undefined) state.scratchpadText = "";
                if (!state.predictionTab) state.predictionTab = "workspace";
                save();
                render();
                toast("تم استعادة البيانات بنجاح!");
            } catch (error) {
                toast("ملف النسخة الاحتياطية غير صالح");
            }
        }
    }
}

function setRadarStatus(subject, status) {
    let now = new Date().getTime();
    let todayStr = new Date().toLocaleDateString("ar-IQ", { year: 'numeric', month: 'numeric', day: 'numeric' });
    state.radarRecords[subject] = {
        status: status,
        date: todayStr,
        timestamp: now
    };
    save();
    render();
    toast(`تم تحديث رادار ${subject} بنجاح`);
}

function checkRadarInactivity(subject) {
    let rec = state.radarRecords?.[subject];
    if (!rec || !rec.timestamp) return { isInactive: false, days: 0 };
    let diffTime = new Date().getTime() - rec.timestamp;
    let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    return { isInactive: diffDays >= 4, days: diffDays };
}

function setPredTab(tab) {
    state.predictionTab = tab;
    save();
    render();
}

function updateDifficulty(val) {
    const levels = ["مبتدئ / تمهيدي", "قياسي / متوسط", "متقدم / تفكير ناقد"];
    let el = document.getElementById('diffVal');
    if(el) el.innerText = levels[val - 1];
}

function handleFilesSelect(files) {
    const list = document.getElementById('fileList');
    if(!list) return;
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const item = document.createElement('div');
        item.className = 'file-item';
        item.style.cssText = "background:var(--panel2); padding:8px 12px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:13px; border:1px solid #4c4024; margin-top:5px;";
        item.innerHTML = `
            <span>📄 ${esc(file.name)}</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <input type="checkbox" checked title="تحديد المصدر" style="width:auto;">
                <button class="btn red" style="padding:2px 6px; font-size:11px;" onclick="deleteSource(this)" title="حذف المصدر">🗑️</button>
            </div>
        `;
        list.appendChild(item);
    }
    toast("تمت إضافة الملفات بنجاح");
}

function addPastedText() {
    const textArea = document.getElementById('pastedTextContent');
    if(!textArea) return;
    const textContent = textArea.value.trim();
    if(!textContent) {
        alert("الرجاء لصق نص أولاً قبل إضافته كمصدر.");
        return;
    }
    const snippetName = "نص_مخصص_" + (document.querySelectorAll('.file-item').length + 1) + ".txt";
    const list = document.getElementById('fileList');
    if(!list) return;
    const item = document.createElement('div');
    item.className = 'file-item';
    item.style.cssText = "background:var(--panel2); padding:8px 12px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:13px; border:1px solid #4c4024; margin-top:5px;";
    item.innerHTML = `
        <span>📝 ${esc(snippetName)}</span>
        <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" checked title="تحديد المصدر" style="width:auto;">
            <button class="btn red" style="padding:2px 6px; font-size:11px;" onclick="deleteSource(this)" title="حذف المصدر">🗑️</button>
        </div>
    `;
    list.appendChild(item);
    textArea.value = "";
    toast("تمت إضافة النص كمصدر بنجاح");
}

function deleteSource(btn) {
    const item = btn.closest('.file-item');
    if (item) {
        item.remove();
        toast("تم حذف المصدر");
    }
}

function generateQuestions() {
    const container = document.getElementById('previewContainer');
    if(!container) return;
    const checkedSources = document.querySelectorAll('.file-item input[type="checkbox"]:checked');
    if (checkedSources.length === 0) {
        alert("الرجاء تحديد مصدر واحد على الأقل عبر مربعات الاختيار لتوليد الأسئلة!");
        return;
    }

    container.innerHTML = `<div style="text-align: center; margin-top: 50px; color: var(--gold);">جاري تحليل المصادر المحددة ومحرك الذكاء الاصطناعي... ⏳</div>`;

    setTimeout(() => {
        const sampleQuestions = [
            { q: "اشرح بالتفصيل العمليات الرئيسية مع ذكر المراحل الأساسية المرتبطة بها؟", type: "مقالي • 15 درجة", prob: "94% احتمال الورود" },
            { q: "قارن بين النظامين أو المفاهيم المختلفة من حيث الخصائص والنتائج؟", type: "جدول مقارنة • 10 درجات", prob: "89% احتمال الورود" },
            { q: "ما هي الوظيفة الأساسية للعنصر الرئيسي في النظام المدروس؟", type: "مصطلحات • 10 درجات", prob: "85% احتمال الورود" },
            { q: "وضح التركيب والتنظيم الهيكلي للمفاهيم الأساسية؟", type: "تفسير • 12 درجة", prob: "80% احتمال الورود" },
            { q: "علل: لماذا يمثل هذا العنصر أهمية بالغة في التطبيقات العملية؟", type: "سؤال علل • 8 درجات", prob: "78% احتمال الورود" }
        ];

        container.innerHTML = '';
        sampleQuestions.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="question-header">
                    <span>السؤال ${index + 1}: ${item.type}</span>
                    <span style="color: var(--gold);">${item.prob}</span>
                </div>
                <div>${item.q}</div>
            `;
            container.appendChild(card);
        });
        toast("تم توليد الأسئلة المتوقعة بنجاح!");
    }, 1200);
}

const pages = {
home: () => `
<div class="grid">
 <div class="card"><span class="muted">الملخصات المحفوظة</span><div class="stat">${state.summaries.length}</div></div>
 <div class="card"><span class="muted">المهام المتبقية</span><div class="stat">${state.tasks.filter(x => !x.done).length}</div></div>
 <div class="card"><span class="muted">ساعات الدراسة</span><div class="stat">${hours()}</div></div>
 <div class="card"><span class="muted">الأرشيفات</span><div class="stat">${state.archives.length}</div></div>
</div><br>
<div class="grid2">
 <div class="card"><h2>مؤشر المعدل</h2><div class="progress"><span style="width:${average()}%"></span></div><p>${average()}% متوسط الدرجات</p></div>
 <div class="card"><h2>إدارة التخزين المحلي</h2><p class="muted">بياناتك محفوظة بأمان داخل متصفحك مباشرة.</p><div class="actions">
 <button class="btn gold" onclick="exportLocalBackup()">تصدير نسخة احتياطية</button>
 <label class="btn gray" style="cursor:pointer;margin:0;display:inline-block">استيراد ملف<input type="file" style="display:none" onchange="importLocalBackup(event)"></label>
 </div></div>
</div>`,

storage: () => `
<div class="storage">
 <div class="subjects"><h3>المواد الدراسية</h3>
 ${subjects.map(s => `<button class="${state.subject === s ? "active" : ""}" onclick="selectSubject('${s}')">${s} (${state.summaries.filter(x => x.subject === s).length})</button>`).join("")}
 </div>
 <div>
 <div class="card">
  <div class="actions" style="justify-content:space-between">
   <h2>مادة: ${state.subject}</h2>
   <div>
    <button class="btn gold" onclick="openModal()">+ إضافة ملخص جديد</button>
   </div>
  </div>
  <p class="muted">نظام تخزين محلي منظم بالكامل ومحفوظ بمتصفحك.</p>
 </div>
 ${state.summaries.filter(x => x.subject === state.subject).map(x => `
 <div class="summary">
  <h3>${esc(x.title)}</h3>
  <p>${esc(x.body)}</p>
  ${x.note ? `<span class="badge">مرجع: ${esc(x.note)}</span>` : ""}
  <div class="actions" style="margin-top:12px">
   <button class="btn" onclick="openModal('${x.id}')">تعديل</button>
   <button class="btn red" onclick="deleteSummary('${x.id}')">حذف</button>
  </div>
 </div>`).join("") || `<div class="empty">لا توجد ملخصات مسجلة لهذه المادة حتى الآن.</div>`}
 </div>
</div>`,

scratchpad: () => `
<div class="card">
 <h2>دفتر الأفكار والملاحظات السريعة</h2>
 <p class="muted">ساحة حرّة مخصصة لتدوين خواطرك السريعة، الأفكار العابرة، أو المسائل المعلقة أثناء الدراسة.</p>
 <br>
 <textarea id="scratchpadInput" placeholder="اكتب هنا أي فكرة، ملاحظة سريعة، أو مسألة تريد الرجوع إليها لاحقاً..." oninput="updateScratchpad(this.value)" style="min-height:250px;">${esc(state.scratchpadText)}</textarea>
 <br>
 <div class="actions" style="margin-top:12px; justify-content:space-between; align-items:center;">
  <span class="muted" id="scratchStatus">يتم الحفظ الفوري تلقائياً...</span>
  <button class="btn red" onclick="clearScratchpad()">مسح المحتوى</button>
 </div>
</div>`,

schedule: () => `
<div class="card"><h2>جدول الحصص</h2><div class="grid2">
<input id="day" placeholder="اليوم (مثل: الأحد)"><input id="schSub" placeholder="المادة">
<input id="schTime" placeholder="الوقت (مثل: 8:00 ص)"><button class="btn gold" onclick="addSchedule()">إضافة للحصص</button>
</div><br><table><tr><th>اليوم</th><th>المادة</th><th>الوقت</th><th>إجراء</th></tr>
${state.schedule.map((x, i) => `<tr><td>${esc(x.day)}</td><td>${esc(x.sub)}</td><td>${esc(x.time)}</td><td><button class="btn red" onclick="delSchedule(${i})">حذف</button></td></tr>`).join("")}
</table></div>`,

calculator: () => `
<div class="card"><h2>حاسبة الإعفاء العام</h2><div class="grid2">
${subjects.map(s => `<label>${s}<input class="grade" data-s="${s}" type="number" min="0" max="100" value="${state.grades[s] ?? ""}"></label>`).join("")}
</div><br><button class="btn gold" onclick="calc()">احسب المعدل</button><div id="result"></div></div>`,

radar: () => `
<div class="card">
 <h2>رادار المواد الراكدة ومتابعة النشاط</h2>
 <p class="muted">ينبهك الرادار إذا مرت 4 أيام أو أكثر دون تسجيل نشاط للمادة.</p>
 <br>
 ${subjects.map(s => {
     let subjectData = state.radarRecords?.[s] || { status: "غير محدد", date: "لا يوجد سجل" };
     let inactivity = checkRadarInactivity(s);
     return `
     <div style="background:var(--panel2);border:1px solid ${inactivity.isInactive ? 'var(--red)' : '#34405d'};border-radius:10px;padding:15px;margin-bottom:12px">
         <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
             <h3 style="margin:0;color:var(--gold)">${s}</h3>
             <div style="display:flex;gap:8px;align-items:center">
                 ${inactivity.isInactive ? `<span class="badge alert">⚠️ المادة خاملة (منذ ${inactivity.days} أيام)</span>` : ""}
                 <span class="badge">الحالة: ${subjectData.status} | آخر تحديث: ${subjectData.date}</span>
             </div>
         </div>

 <div class="card">

  </div>
 </div>

` : ''}

${state.predictionTab === 'history' ? `

 <h3 style="color:var(--gold);">سجل الاختبارات السابقة</h3>

 </p>

pomodoro: () => `

<div class="timer" id="timer">25:00</div><p class="muted">جلسة تركيز دراسي</p>
<div class="actions" style="justify-content:center"><button class="btn gold" onclick="toggleTimer()">تشغيل / إيقاف</button><button class="btn gray" onclick="resetTimer()">إعادة ضبط</button></div>
</div><div class="card"><h2>إحصائيات الدراسة</h2><div class="stat">${hours()} ساعات</div><p>${studyTime()}</p>
<div class="progress"><span style="width:${Math.min(state.studySeconds / 144, 100)}%"></span></div>
<p class="muted">الهدف اليومي: 4 ساعات</p><button class="btn red" onclick="resetStats()">تصفير الساعات</button>
</div></div>`,

tasks: () => `
<div class="card"><h2>قائمة المهام</h2><div class="grid2"><input id="task" placeholder="مهمة جديدة..."><button class="btn gold" onclick="addTask()">إضافة للحصص</button></div>
${state.tasks.map((x, i) => `<div class="task ${x.done ? "done" : ""}"><input type="checkbox" ${x.done ? "checked" : ""} onchange="toggleTask(${i})"><span>${esc(x.text)}</span><button class="btn red" onclick="delTask(${i})">حذف</button></div>`).join("") || `<div class="empty">لا توجد مهام حالية</div>`}</div>`,

gemini: () => `
<div class="card">
 <h2>محادثة مع Gemini</h2>
 <p class="muted">مساعدك الذكي لشرح المناهج وتوقع الأسئلة.</p>
 <div class="chat" id="chat"></div>
 <div class="chatrow">
  <textarea id="question" placeholder="اكتب سؤالك هنا..." onkeydown="keyChat(event)"></textarea>
  <button class="btn gold" onclick="sendGemini()">إرسال</button>
  <button class="btn red" onclick="clearGeminiChat()">مسح المحادثة</button>
 </div>
</div>`,

settings: () => `
<div class="grid2">
 <div class="card"><h2>إعدادات التطبيق</h2>
 <label>اسم الطالب</label><input value="${esc(localStorage.getItem("studentName") || "")}" onchange="localStorage.setItem('studentName',this.value)">
 <br><button class="btn gold" onclick="activateGemini()">إدخال مفتاح Gemini</button>
 <button class="btn gray" onclick="removeKey()">حذف المفتاح</button><br><br>
 <button class="btn red" onclick="clearAll()">مسح كافة البيانات نهائياً</button></div>
 <div class="card"><h2>الأرشيف السنوي</h2>${state.archives.map(x => `<p>${x.date} — ${x.count} ملخص محفوظ</p>`).join("") || `<p class="muted">لا توجد أرشيفات سابقة.</p>`}</div>
</div>`
};

function render() {
 document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.page === state.page));
 document.getElementById("title").textContent = { home: "لوحة التحكم", storage: "المخزن المحلي", scratchpad: "دفتر الأفكار السريعة", schedule: "جدول الحصص", calculator: "حاسبة الإعفاء العام", radar: "رادار المواد الراكدة", prediction: "نظام التنبؤ الذكي", pomodoro: "مؤقت بومودورو", tasks: "قائمة المهام", gemini: "محادثة جيميناي", settings: "الإعدادات" }[state.page];
 document.getElementById("date").textContent = new Date().toLocaleDateString("ar-IQ", { dateStyle: "full" });
 document.getElementById("content").innerHTML = pages[state.page]();
 if (state.page === "pomodoro") updateTimer();
 if (state.page === "gemini") restoreChat();
}

function selectSubject(s) { state.subject = s; save(); render(); }
function openModal(id = "") { let x = state.summaries.find(a => a.id === id); modal.classList.add("show"); editId.value = id; modalTitle.textContent = x ? "تعديل ملخص" : "إضافة ملخص"; sumTitle.value = x?.title || ""; sumBody.value = x?.body || ""; sumNote.value = x?.note || ""; }
function closeModal() { modal.classList.remove("show"); }
function saveSummary() {
    let title = sumTitle.value.trim(), body = sumBody.value.trim(), note = sumNote.value.trim(), id = editId.value;
    if (!title) return toast("يرجى كتابة عنوان الملخص");
    if (id) {
        let x = state.summaries.find(a => a.id === id);
        Object.assign(x, { title, body, note });
    } else {
        state.summaries.push({ id: Date.now() + "", subject: state.subject, title, body, note });
    }
    save(); closeModal(); render(); toast("تم حفظ الملخص محلياً بنجاح");
}
function deleteSummary(id) { if (confirm("هل تريد حذف هذا الملخص؟")) { state.summaries = state.summaries.filter(x => x.id !== id); save(); render(); } }

function updateScratchpad(val) {
    state.scratchpadText = val;
    save();
    let status = document.getElementById("scratchStatus");
    if(status) {
        status.textContent = "تم الحفظ تلقائياً";
        setTimeout(() => { if(status) status.textContent = "يتم الحفظ الفوري تلقائياً..."; }, 1500);
    }
}
function clearScratchpad() {
    if (confirm("هل تريد مسح محتوى دفتر الأفكار بالكامل؟")) {
        state.scratchpadText = "";
        save();
        render();
        toast("تم مسح دفتر الأفكار");
    }
}

function calc() { document.querySelectorAll(".grade").forEach(x => { if (x.value !== "") state.grades[x.dataset.s] = +x.value; }); save(); let a = average(); result.innerHTML = `<div class="card" style="margin-top:15px"><h2>المعدل: ${a}%</h2><p>${a >= 85 ? "مؤشر ممتاز، واصل التفوق!" : "استمر بالمراجعة لتحقيق الإعفاء."}</p></div>`; }
function addSchedule() { if (day.value && schSub.value) { state.schedule.push({ day: day.value, sub: schSub.value, time: schTime.value }); save(); render(); } }
function delSchedule(i) { state.schedule.splice(i, 1); save(); render(); }
function addTask() { if (task.value.trim()) { state.tasks.push({ text: task.value.trim(), done: false }); save(); render(); } }
function toggleTask(i) { state.tasks[i].done = !state.tasks[i].done; save(); render(); }
function delTask(i) { state.tasks.splice(i, 1); save(); render(); }
function archiveYear() { if (confirm("أرشفة السنة الحالية؟")) { state.archives.push({ date: new Date().toLocaleDateString("ar-IQ"), count: state.summaries.length }); save(); toast("تمت الأرشفة بنجاح"); } }
function clearAll() { if (confirm("تحذير: سيتم مسح جميع البيانات نهائياً! هل أنت متأكد؟")) { localStorage.removeItem("studentApp"); location.reload(); } }

let timer = 1500, running = false, interval = null;
function updateTimer() { if (document.getElementById("timer")) document.getElementById("timer").textContent = fmtTime(timer); }
function toggleTimer() {
    if (running) { running = false; clearInterval(interval); toast("تم إيقاف المؤقت"); return; }
    running = true; toast("بدأت جلسة الدراسة");
    interval = setInterval(() => {
        if (timer <= 0) { clearInterval(interval); running = false; toast("انتهت الجلسة بنجاح"); return; }
        timer--; state.studySeconds++; save(); updateTimer();
    }, 1000);
}
function resetTimer() { clearInterval(interval); running = false; timer = 1500; updateTimer(); }
function resetStats() { if (confirm("تصفير ساعات الدراسة؟")) { state.studySeconds = 0; save(); render(); } }

let chatHistory = JSON.parse(localStorage.getItem("geminiChat") || "[]");
function activateGemini() { let k = prompt("أدخل مفتاح Gemini API:"); if (k?.trim()) { GEMINI_API_KEY = k.trim(); sessionStorage.setItem("geminiKey", GEMINI_API_KEY); toast("تم تفعيل جيميناي"); } }
function removeKey() { GEMINI_API_KEY = ""; sessionStorage.removeItem("geminiKey"); toast("تمت إزالة المفتاح"); }
function clearGeminiChat() {
    chatHistory = [];
    localStorage.removeItem("geminiChat");
    let c = document.getElementById("chat");
    if (c) c.innerHTML = "";
    toast("تمت مسح المحادثة");
}
function addMsg(text, type) { let c = document.getElementById("chat"); if (!c) return; let d = document.createElement("div"); d.className = "msg " + type; d.textContent = text; c.appendChild(d); c.scrollTop = c.scrollHeight; }
function restoreChat() { chatHistory.forEach(x => addMsg(x.text, x.role === "user" ? "user" : "ai")); }
function keyChat(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendGemini(); } }
async function sendGemini() {
    let q = document.getElementById("question"); if (!q) return; let text = q.value.trim(); if (!text) return;
    if (!GEMINI_API_KEY) GEMINI_API_KEY = sessionStorage.getItem("geminiKey") || "";
    if (!GEMINI_API_KEY) { activateGemini(); return; }
    q.value = ""; addMsg(text, "user"); chatHistory.push({ role: "user", text }); localStorage.setItem("geminiChat", JSON.stringify(chatHistory));
    addMsg("جيميناي يكتب...", "ai");
    try {
        let contents = chatHistory.map(x => ({ role: x.role === "user" ? "user" : "model", parts: [{ text: x.text }] }));
        let r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=" + encodeURIComponent(GEMINI_API_KEY), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: "أنت مساعد دراسي عربي لطالب في العراق." }] } }) });
        let d = await r.json(); if (!r.ok) throw Error(d?.error?.message || "فشل الاتصال");
        let answer = d?.candidates?.[0]?.content?.parts?.map(x => x.text).join("") || "لا توجد إجابة";
        document.querySelectorAll(".msg.ai:last-child")[0].textContent = answer;
        chatHistory.push({ role: "model", text: answer }); localStorage.setItem("geminiChat", JSON.stringify(chatHistory));
    } catch (e) { document.querySelectorAll(".msg.ai:last-child")[0].textContent = "خطأ: " + e.message; }
}

render();
</script>
</body>
</html>
